<style>
/* 01 — LAYER PEEL PHILOSOPHY */
.philosophy {
  background: #e9e9d5 !important;
  color: #17291c !important;
  padding: clamp(80px, 9vw, 150px) 6% !important;
  min-height: 100vh;
  overflow: visible;
}

.philosophy .kicker {
  color: #45643c;
  margin-bottom: 35px;
}

.philosophy > h1 {
  display: none !important;
}

.peel-stage {
  position: relative;
  max-width: 1250px;
  margin: 0 auto;
  perspective: 1400px;
}

.peel-card {
  position: relative;
  display: flex;
  align-items: center;
  padding: clamp(28px, 5vw, 75px);
  margin-bottom: -20px;
  min-height: clamp(140px, 20vw, 260px);
  border-radius: 8px 32px 12px 28px;
  box-shadow:
    0 18px 30px rgba(24, 40, 25, .13),
    0 3px 5px rgba(24, 40, 25, .08),
    inset 0 2px 1px rgba(255,255,255,.45);
  transform-origin: top left;
  transform-style: preserve-3d;
  transition: transform .65s cubic-bezier(.2,.8,.2,1),
              box-shadow .65s ease;
  will-change: transform;
}

.peel-card:nth-child(1) {
  background: #f8e9db;
  z-index: 3;
  transform: rotate(-2deg);
}

.peel-card:nth-child(2) {
  background: #c8d7a5;
  z-index: 2;
  transform: rotate(1.5deg);
}

.peel-card:nth-child(3) {
  background: #233f2d;
  z-index: 1;
  min-height: clamp(210px, 28vw, 360px);
  margin-bottom: 0;
  transform: rotate(-1deg);
}

.peel-card::after {
  content: "";
  position: absolute;
  top: 0;
  right: 0;
  width: clamp(35px, 7vw, 85px);
  height: clamp(35px, 7vw, 85px);
  background: linear-gradient(
    225deg,
    rgba(255,255,255,.72) 0%,
    rgba(255,255,255,.22) 47%,
    transparent 50%
  );
  border-radius: 0 25px 0 15px;
  pointer-events: none;
}

.peel-card h2 {
  font-size: clamp(38px, 7.2vw, 112px);
  line-height: 1.03;
  letter-spacing: -.065em;
  font-weight: 850;
  margin: 0;
  color: #17291c;
}

.peel-card.final-peel {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  gap: 20px;
}

.final-peel .peel-label {
  font-size: clamp(11px, 1.1vw, 15px);
  font-weight: 800;
  letter-spacing: .2em;
  color: #d6fc64;
}

.final-peel h2 {
  color: #fff4e5;
  font-size: clamp(40px, 7.5vw, 115px);
}

.final-peel em {
  color: #d6fc64;
  font-style: italic;
  text-decoration: underline;
  text-decoration-thickness: .055em;
  text-underline-offset: .12em;
}

.peel-card.is-visible:nth-child(1) {
  transform: rotate(-2deg) translateY(0);
}

.peel-card.is-visible:nth-child(2) {
  transform: rotate(1.5deg) translateY(0);
}

.peel-card.is-visible:nth-child(3) {
  transform: rotate(-1deg) translateY(0);
}

@media (hover:hover) {
  .peel-card:nth-child(1):hover {
    transform: rotate(-5deg) rotateY(-7deg) translateY(-12px);
  }

  .peel-card:nth-child(2):hover {
    transform: rotate(4deg) rotateY(6deg) translateY(-12px);
  }

  .peel-card:nth-child(3):hover {
    transform: rotate(0deg) translateY(-10px);
  }
}

/* 02 — GRANT THORNTON WATERCOLOUR WASH */
.gt {
  position: relative;
  isolation: isolate;
  background: #eaf0df !important;
}

.gt::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(
      ellipse 43% 27% at 85% 12%,
      rgba(151,197,197,.36),
      transparent 80%
    ),
    radial-gradient(
      ellipse 42% 30% at 8% 32%,
      rgba(173,195,139,.28),
      transparent 80%
    ),
    radial-gradient(
      ellipse 48% 22% at 60% 48%,
      rgba(247,222,207,.34),
      transparent 85%
    ),
    radial-gradient(
      ellipse 35% 35% at 20% 80%,
      rgba(182,211,202,.30),
      transparent 80%
    );
}

.gt .campaign-head {
  position: relative;
  z-index: 1;
}

/* 03 + 05 — VERTICAL STRATEGY REVEALS */
.gt .strategy-strip,
.nuvama .strategy-strip {
  display: flex !important;
  flex-direction: column !important;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 0;
  padding: clamp(38px, 6vw, 85px) !important;
  overflow: hidden;
}

.gt .strategy-strip {
  background: #102319 !important;
  border-left: 9px solid #d6fc64;
}

.nuvama .strategy-strip {
  background: #382049 !important;
  border-left: 0;
}

.gt .strategy-eyebrow,
.nuvama .strategy-eyebrow {
  display: block;
  color: #d6fc64 !important;
  font-size: 12px !important;
  font-weight: 800;
  letter-spacing: .2em !important;
  margin-bottom: 32px;
}

.vertical-strategy {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  width: 100%;
  max-width: 1050px;
}

.vertical-strategy .strategy-source {
  font-size: clamp(38px, 6vw, 88px);
  line-height: 1.03;
  letter-spacing: -.065em;
  font-weight: 850;
  color: #fff4e8;
  margin: 0;
}

.vertical-strategy .strategy-arrow {
  font-size: clamp(42px, 5vw, 70px);
  line-height: 1;
  font-weight: 400;
  color: #d6fc64;
  transition: transform .7s ease;
}

.vertical-strategy .strategy-destination {
  width: 100%;
  padding: clamp(25px, 4vw, 55px);
  border-radius: 5px;
  font-size: clamp(38px, 6vw, 88px);
  line-height: 1.05;
  letter-spacing: -.065em;
  font-weight: 850;
  margin: 0;
  background: #d6fc64;
  color: #102319;
  box-sizing: border-box;
  box-shadow: 0 18px 35px rgba(0,0,0,.12);
}

.nuvama .strategy-destination {
  background: #e8d3f1;
  color: #382049;
}

.gt .strategy-detail,
.nuvama .strategy-detail {
  width: 100%;
  max-width: 800px;
  margin: 30px auto 0 !important;
  padding-top: 24px;
  border-top: 1px solid rgba(255,255,255,.25);
  color: #fff4e8;
  text-align: center;
  font-size: clamp(15px, 1.5vw, 20px) !important;
  line-height: 1.6;
}

.gt-strategy-grid,
.nuvama-strategy-flow {
  display: none !important;
}

/* 04 — NUVAMA EMBOSSED HERITAGE */
.nuvama {
  position: relative;
  isolation: isolate;
  background: #f5e7d5 !important;
}

.nuvama::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  opacity: .42;
  background-image:
    radial-gradient(
      circle at center,
      rgba(145,104,157,.16) 1.6px,
      transparent 2.6px
    ),
    radial-gradient(
      circle at center,
      rgba(255,255,255,.6) 1.6px,
      transparent 2.6px
    );
  background-size: 46px 46px;
  background-position: 0 0, 2px 2px;
  mask-image: linear-gradient(
    90deg,
    black,
    transparent 35%,
    transparent 65%,
    black
  );
  -webkit-mask-image: linear-gradient(
    90deg,
    black,
    transparent 35%,
    transparent 65%,
    black
  );
}

.nuvama .campaign-head {
  position: relative;
  z-index: 1;
}

/* 06 — KURKURE ACID EDITORIAL */
.kurkure {
  background: #d8ff68 !important;
}

.kurkure .campaign-head {
  max-width: 1200px;
}

.kurkure .campaign-head > h2,
.kurkure .campaign-head > .campaign-lead {
  display: none !important;
}

.acid-editorial {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: clamp(20px, 3vw, 45px);
  padding: clamp(25px, 4vw, 50px) 0;
}

.acid-editorial .acid-title {
  font-size: clamp(45px, 7vw, 105px);
  font-weight: 850;
  line-height: 1.05;
  letter-spacing: -.065em;
  color: #142317;
  margin: 0;
}

.acid-editorial .acid-impact {
  display: inline-block;
  max-width: 100%;
  background: #a62e1d;
  color: #fff1d5;
  padding: clamp(24px, 4vw, 60px);
  border-radius: 3px;
  box-shadow: 14px 14px 0 rgba(20,35,23,.12);
  transform: rotate(-1deg);
  transition: transform .45s ease;
}

.acid-editorial .acid-impact h2 {
  margin: 0;
  font-size: clamp(45px, 8vw, 125px);
  font-weight: 900;
  line-height: 1.02;
  letter-spacing: -.07em;
  color: inherit;
}

@media (hover:hover) {
  .acid-impact:hover {
    transform: rotate(0deg) translateY(-7px);
  }
}

/* SCROLL REVEALS */
.reveal-on-scroll {
  opacity: 0;
  transform: translateY(35px);
  transition:
    opacity .75s ease,
    transform .75s cubic-bezier(.2,.8,.2,1);
}

.reveal-on-scroll.revealed {
  opacity: 1;
  transform: translateY(0);
}

.vertical-strategy.revealed .strategy-arrow {
  animation: arrow-drop 1.2s ease both;
}

@keyframes arrow-drop {
  from {transform: translateY(-18px); opacity: 0;}
  to {transform: translateY(0); opacity: 1;}
}

/* RESPONSIVE */
@media(max-width: 700px) {
  .philosophy {
    padding: 75px 6% !important;
    min-height: auto;
  }

  .peel-card {
    margin-bottom: -10px;
    min-height: 150px;
    padding: 25px;
  }

  .peel-card h2 {
    font-size: clamp(32px, 8vw, 55px);
  }

  .final-peel h2 {
    font-size: clamp(34px, 8vw, 58px);
  }

  .gt .strategy-strip,
  .nuvama .strategy-strip {
    padding: 40px 22px !important;
  }

  .vertical-strategy .strategy-source,
  .vertical-strategy .strategy-destination {
    font-size: clamp(34px, 9vw, 55px);
  }

  .acid-editorial .acid-title {
    font-size: clamp(39px, 9vw, 65px);
  }

  .acid-editorial .acid-impact h2 {
    font-size: clamp(40px, 10vw, 72px);
  }
}

@media(prefers-reduced-motion: reduce) {
  .peel-card,
  .acid-impact,
  .reveal-on-scroll,
  .vertical-strategy .strategy-arrow {
    animation: none !important;
    transition: none !important;
    opacity: 1 !important;
  }
}
</style>

<script>
(function () {
  "use strict";

  function initializeDesignUpdates() {

    /* CHANGE 1 — LAYER PEEL */
    const philosophy = document.querySelector(".philosophy");

    if (philosophy && !philosophy.querySelector(".peel-stage")) {
      const stage = document.createElement("div");
      stage.className = "peel-stage";

      stage.innerHTML = `
        <div class="peel-card">
          <h2>Different audiences.</h2>
        </div>

        <div class="peel-card">
          <h2>Different results.</h2>
        </div>

        <div class="peel-card final-peel">
          <span class="peel-label">
            THE JOB REMAINS THE SAME
          </span>
          <h2>
            Make them <em>feel</em> something.
          </h2>
        </div>
      `;

      philosophy.appendChild(stage);
    }

    /* CHANGE 3 — GRANT THORNTON STRATEGY */
    const gtStrategy =
      document.querySelector(".gt .strategy-strip");

    if (gtStrategy) {
      gtStrategy.innerHTML = `
        <span class="strategy-eyebrow">
          THE STRATEGY
        </span>

        <div class="vertical-strategy reveal-on-scroll">
          <h3 class="strategy-source">
            Institutional<br>credibility.
          </h3>

          <div class="strategy-arrow" aria-hidden="true">
            ↓
          </div>

          <h3 class="strategy-destination">
            Emotional<br>reassurance.
          </h3>
        </div>

        <p class="strategy-detail">
          Through inclusive storytelling,
          expert voices and empathy.
        </p>
      `;
    }

    /* CHANGE 5 — NUVAMA STRATEGY */
    const nuvamaStrategy =
      document.querySelector(".nuvama .strategy-strip");

    if (nuvamaStrategy) {
      nuvamaStrategy.innerHTML = `
        <span class="strategy-eyebrow">
          THE STRATEGY
        </span>

        <div class="vertical-strategy reveal-on-scroll">
          <h3 class="strategy-source">
            Global investing.
          </h3>

          <div class="strategy-arrow" aria-hidden="true">
            ↓
          </div>

          <h3 class="strategy-destination">
            Local confidence.
          </h3>
        </div>

        <p class="strategy-detail">
          Make global investing feel local,
          approachable and empowering
          through cultural relevance
          and financial education.
        </p>
      `;
    }

    /* CHANGE 6 — KURKURE ACID EDITORIAL */
    const kurkureHead =
      document.querySelector(".kurkure .campaign-head");

    if (kurkureHead && !kurkureHead.querySelector(".acid-editorial")) {
      const editorial = document.createElement("div");
      editorial.className = "acid-editorial";

      editorial.innerHTML = `
        <h2 class="acid-title">
          Matcha × Kurkure.
        </h2>

        <div class="acid-impact">
          <h2>
            The ultimate<br>ragebait.
          </h2>
        </div>
      `;

      kurkureHead.appendChild(editorial);
    }

    /* INTERSECTION-BASED REVEAL ANIMATION */
    const revealElements =
      document.querySelectorAll(".reveal-on-scroll");

    const reduceMotion =
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    if (reduceMotion || !("IntersectionObserver" in window)) {
      revealElements.forEach(el => el.classList.add("revealed"));
    } else {
      const observer = new IntersectionObserver(
        entries => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add("revealed");
              observer.unobserve(entry.target);
            }
          });
        },
        {threshold: 0.15}
      );

      revealElements.forEach(el => observer.observe(el));
    }

    /* PRESERVE NAVIGATION */
    const nav = document.querySelector(".site-nav");

    if (nav) {
      nav.innerHTML = `
        <a href="#grant-video">Campaigns</a>
        <a href="#about">About</a>
      `;
    }

    /* ENSURE ARTWORK IS DISPLAYED */
    document.querySelectorAll(".approved-board").forEach(board => {
      const img = board.querySelector("img");
      const placeholder = board.querySelector(".board-placeholder");

      if (img) {
        img.hidden = false;
        img.style.display = "block";
        img.style.width = "100%";
        img.style.height = "auto";

        img.addEventListener("load", () => {
          if (placeholder) placeholder.style.display = "none";
        });

        img.addEventListener("error", () => {
          img.style.display = "none";
          if (placeholder) placeholder.style.display = "";
        });

        if (img.complete && img.naturalWidth > 0 && placeholder) {
          placeholder.style.display = "none";
        }
      }
    });

  }

  if (document.readyState === "loading") {
    document.addEventListener(
      "DOMContentLoaded",
      initializeDesignUpdates
    );
  } else {
    initializeDesignUpdates();
  }
})();
</script>
